# CI for travelhub-mobile (Kotlin + Jetpack Compose).
# Builds, tests, enforces 80% coverage with Kover, and produces an APK as artifact.
# On `travelhub-mobile-v*` tags, attaches the APK to a GitHub Release.

name: Mobile CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
    tags:
      - "travelhub-mobile-v*"
    paths:
      - "travelhub-mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "travelhub-mobile/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: write   # needed by softprops/action-gh-release

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./travelhub-mobile

jobs:
  Lint_Test_Build:
    name: Lint, test, coverage and APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('travelhub-mobile/**/*.gradle*', 'travelhub-mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Coverage + verify 80% threshold
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-mobile-coverage
          path: travelhub-mobile/app/build/reports/kover
          retention-days: 14

      - name: Build APK (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/travelhub-mobile-v') }}
        run: ./gradlew assembleDebug

      - name: Build APK (release)
        if: ${{ startsWith(github.ref, 'refs/tags/travelhub-mobile-v') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
          ./gradlew assembleRelease

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-mobile-apk
          path: travelhub-mobile/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/travelhub-mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: travelhub-mobile/app/build/outputs/apk/release/*.apk
