# End-to-end tests for travelhub-mobile, driven by Maestro on a headless
# Android emulator. Heavier than the unit-test workflow — boots a real
# emulator (~15-25 min per run), so this is intentionally a MANUAL-ONLY
# workflow. Use the Actions UI to launch it against any branch.
#
# Uses a single API level / arch combo to keep runs tractable. Add a
# matrix only if you really need device coverage.

name: Mobile E2E

on:
  # Manual-only: trigger from the GitHub Actions UI ("Run workflow") on
  # whichever branch you want to validate. Do not add `push`, `pull_request`,
  # or `schedule` triggers without an explicit decision — the emulator boot
  # is too costly for per-commit feedback.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Maestro_E2E:
    name: Maestro E2E (API 30, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # KVM access is required to run a hardware-accelerated emulator on the
    # Linux runner. ubuntu-latest exposes /dev/kvm; this guard makes the
    # failure obvious if a future runner change removes it.
    env:
      ANDROID_API_LEVEL: 30
      ANDROID_TARGET: default
      ANDROID_ARCH: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('travelhub-mobile/**/*.gradle*', 'travelhub-mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        working-directory: travelhub-mobile
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: travelhub-mobile
        run: ./gradlew assembleDebug

      # Stash the APK so reviewers can download exactly the binary that the
      # Maestro suite tested against — useful when reproducing a flaky flow
      # locally on a device of choice.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-mobile-apk-e2e
          path: travelhub-mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro install
        run: maestro --version

      # AVD cache speeds up the next run by ~5 min. The key includes the
      # API level so a bump invalidates it cleanly.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-${{ env.ANDROID_ARCH }}

      - name: Create AVD and snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot"

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail

            echo "Waiting for device..."
            adb wait-for-device

            echo "Installing debug APK..."
            adb install -r travelhub-mobile/app/build/outputs/apk/debug/app-debug.apk

            echo "Running Maestro suite..."
            maestro test travelhub-mobile/.maestro/ \
              --debug-output maestro-output \
              --format junit \
              --output maestro-output/junit.xml

      - name: Upload Maestro debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            maestro-output
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Maestro JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-junit
          path: maestro-output/junit.xml
          retention-days: 14
          if-no-files-found: warn
