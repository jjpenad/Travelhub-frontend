# CI del frontend (Vite + React en travelhub-web).
# Monorepo: añade workflows separados cuando exista travelhub-mobile.

name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "travelhub-web/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "travelhub-web/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: ./travelhub-web

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint_Test_Build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: travelhub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm run test:ci

      - name: Production build
        run: npm run build
