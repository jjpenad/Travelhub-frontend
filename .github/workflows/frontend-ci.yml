# CI del frontend (Vite + React en travelhub-web).
# Monorepo: añade workflows separados cuando exista travelhub-mobile.
# Gate de cobertura 80% (líneas/statements/functions) aplicado por Vitest
# sobre los módulos de lógica `src/services`, `src/auth`, `src/bookings`,
# `src/constants` — equivalente a `koverVerify minBound(80)` en mobile.

name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "travelhub-web/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "travelhub-web/**"

permissions:
  contents: read

# Despliegue Amplify: opcional. Crea la variable del repo ENABLE_AMPLIFY_DEPLOY=true
# y los secretos listados en el job Deploy_Amplify. Sin la variable, solo corre CI.

defaults:
  run:
    working-directory: ./travelhub-web

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint_Test_Build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: travelhub-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # `test:coverage` corre Vitest con el reporter v8 + el threshold del
      # 80% configurado en vitest.config.js. Si la cobertura cae por debajo
      # del umbral en cualquiera de las métricas (lines/statements/functions),
      # vitest sale con código distinto de 0 y este step falla — mismo
      # contrato que `./gradlew koverVerify` en travelhub-mobile.
      - name: Run unit tests + coverage gate (Vitest)
        run: npm run test:coverage

      # Subimos el reporte HTML/JSON SOLO cuando algo falla, para que los
      # devs puedan inspeccionar qué módulo bajó el threshold sin saturar
      # el storage en runs verdes (mismo patrón del workflow mobile).
      - name: Upload coverage report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travelhub-web-coverage
          path: travelhub-web/coverage
          retention-days: 14
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

