# AWS Amplify Hosting build spec (monorepo: app en travelhub-web).
# En la consola de Amplify, conecta este repositorio y usa este archivo como especificación de build
# (raíz del repo), o configura la ruta a amplify.yml si la mueves.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - cd travelhub-web && npm ci
    build:
      commands:
        - cd travelhub-web && npm run build
  artifacts:
    baseDirectory: travelhub-web/dist
    files:
      - "**/*"
  cache:
    paths:
      - travelhub-web/node_modules/**/*
